<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MooMoo Local</title><style>*{box-sizing:border-box}body{margin:0;background:#8fbc69;font:600 15px Arial;color:#fff;overflow:hidden}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#182a23c9;padding:14px;border-radius:14px;line-height:1.9}#right{position:fixed;right:12px;top:12px;background:#182a23c9;padding:14px;border-radius:14px;min-width:170px}#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#182a23b8;padding:9px;border-radius:14px;max-width:98vw;overflow:auto}button{background:#f5f5f5;border:0;border-radius:9px;padding:9px;cursor:pointer;font-weight:bold}button.active{background:#f7c55b}#upgrade{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#192b27ee;padding:22px;border-radius:18px;display:none;text-align:center;min-width:300px}#upgrade button{margin:6px}#hint{position:fixed;bottom:90px;left:12px;background:#182a23bb;padding:10px;border-radius:10px;font-size:12px}#health{color:#ff8888}</style><canvas id="game"></canvas><div id="hud"><b>MooMoo Local</b><div id="stats"></div><div id="health"></div><div id="age"></div></div><div id="right"><b>Leaderboard</b><div id="leaders"></div></div><div id="upgrade"><h2>AGE UP!</h2><p>Выбери улучшение</p><div id="choices"></div></div><div id="hint">WASD — ходьба · Мышь — направление · ЛКМ/пробел — действие · 1–9 — предмет · E — еда · R — перезапуск</div><div id="bar"></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const WORLD=3400;const kinds={tree:{hp:95,color:'#397c37',radius:29,wood:12,xp:12},rock:{hp:130,color:'#888d91',radius:25,stone:12,xp:14},gold:{hp:160,color:'#e7b94c',radius:23,gold:10,xp:18},berry:{hp:65,color:'#a14c6e',radius:20,food:12,xp:10}};let nodes=[],builds=[],bots=[],animals=[],shots=[],particles=[],keys={},mouse={x:0,y:0,down:false},selected=0,paused=false,last=0,uid=0;
const items=[['Hammer','weapon'],['Axe','weapon'],['Sword','weapon'],['Spear','weapon'],['Apple','food'],['Wall','wall'],['Spike','spike'],['Windmill','mill'],['Turret','turret']];
let p;function actor(x,y,name,bot=false){return {id:++uid,x,y,name,bot,hp:100,maxhp:100,angle:0,age:1,xp:0,score:0,kills:0,wood:0,stone:0,gold:0,food:20,speed:bot?120:190,attack:0,weapon:0,dead:false,respawn:0,brain:0,target:null,buildCooldown:0};}
function reset(){nodes=[];builds=[];bots=[];shots=[];particles=[];uid=0;p=actor(WORLD/2,WORLD/2,'YOU');for(let i=0;i<300;i++){let type=Math.random()<.48?'tree':Math.random()<.75?'rock':Math.random()<.8?'gold':'berry';nodes.push({id:++uid,x:rand(60,WORLD-60),y:rand(60,WORLD-60),type,hp:kinds[type].hp})}for(let i=0;i<13;i++){let b=actor(rand(100,WORLD-100),rand(100,WORLD-100),'BOT '+(i+1),true);b.wood=30;b.stone=20;bots.push(b)}for(let i=0;i<45;i++){let type=['cow','pig','bull','wolf'][Math.floor(Math.random()*4)];animals.push({id:++uid,x:rand(60,WORLD-60),y:rand(60,WORLD-60),type,hp:type==='bull'?160:75,angle:rand(0,6.28),speed:type==='wolf'?110:55,think:0})}selected=0;paused=false;document.querySelector('#upgrade').style.display='none';renderBar()}reset();
function addParticles(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-110,110),vy:rand(-110,110),life:rand(.2,.65),color})}
function earn(a,n){let k=kinds[n.type];for(let t of ['wood','stone','gold','food'])if(k[t])a[t]+=k[t];a.xp+=k.xp;a.score+=k.xp;if(a===p)checkAge()}
function checkAge(){let needed=p.age*110;if(p.xp>=needed&&p.age<12&&!paused){p.xp-=needed;p.age++;paused=true;let choices=p.age%2?[['+25 HP',()=>{p.maxhp+=25;p.hp+=25}],['+25% speed',()=>p.speed*=1.25]]:[['+35% damage',()=>p.damage=(p.damage||1)*1.35],['+20% resources',()=>p.bonus=(p.bonus||0)+.2]];document.querySelector('#choices').replaceChildren(...choices.map(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{fn();paused=false;document.querySelector('#upgrade').style.display='none'};return b}));document.querySelector('#upgrade').style.display='block'}}
function hit(a){if(a.dead||a.attack>0)return;a.attack=a.weapon===3?.65:.35;let range=[70,85,95,120][a.weapon]||70,damage=([20,29,35,25][a.weapon]||20)*(a.damage||1);for(let n of [...nodes])if(dist(a,n)<range+20&&Math.abs(Math.atan2(Math.sin(Math.atan2(n.y-a.y,n.x-a.x)-a.angle),Math.cos(Math.atan2(n.y-a.y,n.x-a.x)-a.angle)))<1.4){n.hp-=damage;if(n.hp<=0){earn(a,n);nodes.splice(nodes.indexOf(n),1);addParticles(n.x,n.y,kinds[n.type].color)}}for(let animal of [...animals])if(dist(a,animal)<range+22&&Math.abs(Math.atan2(Math.sin(Math.atan2(animal.y-a.y,animal.x-a.x)-a.angle),Math.cos(Math.atan2(animal.y-a.y,animal.x-a.x)-a.angle)))<1.25){animal.hp-=damage;if(animal.hp<=0){animals.splice(animals.indexOf(animal),1);a.food+=animal.type==='bull'?35:20;a.xp+=20;a.score+=20;addParticles(animal.x,animal.y,'#a77c59');if(a===p)checkAge()}}for(let b of [...bots,p])if(b!==a&&!b.dead&&dist(a,b)<range+18&&Math.abs(Math.atan2(Math.sin(Math.atan2(b.y-a.y,b.x-a.x)-a.angle),Math.cos(Math.atan2(b.y-a.y,b.x-a.x)-a.angle)))<1.25)hurt(b,damage,a);for(let b of [...builds])if(b.owner!==a.id&&dist(a,b)<range+25){b.hp-=damage;if(b.hp<=0){builds.splice(builds.indexOf(b),1);addParticles(b.x,b.y,'#aaa')}}}
function hurt(a,d,by){a.hp-=d;addParticles(a.x,a.y,'#f55',4);if(a.hp<=0){a.dead=true;a.respawn=3;if(by){by.kills++;by.score+=100;by.gold+=15}if(a===p)setTimeout(()=>{if(p.dead){p.hp=p.maxhp;p.dead=false;p.x=WORLD/2;p.y=WORLD/2;p.wood=p.stone=p.gold=0}},3000)}}
const costs={wall:{wood:10},spike:{wood:15,stone:5},mill:{wood:20,stone:10},turret:{wood:30,stone:30,gold:15}};function build(a,type){let cost=costs[type];if(!cost||a.buildCooldown>0||builds.filter(b=>b.owner===a.id).length>=45)return;for(let k in cost)if(a[k]<cost[k])return;let x=a.x+Math.cos(a.angle)*85,y=a.y+Math.sin(a.angle)*85;if(x<20||y<20||x>WORLD-20||y>WORLD-20||builds.some(b=>Math.hypot(b.x-x,b.y-y)<45))return;for(let k in cost)a[k]-=cost[k];builds.push({id:++uid,x,y,type,owner:a.id,hp:type==='wall'?230:130,tick:0});a.buildCooldown=.28}
function action(){if(selected<4){p.weapon=selected;hit(p)}else if(selected===4)eat(p);else build(p,items[selected][1])}
function eat(a){if(a.food>=10&&a.hp<a.maxhp){a.food-=10;a.hp=Math.min(a.maxhp,a.hp+35)}}
function renderBar(){let bar=document.querySelector('#bar');bar.replaceChildren(...items.map(([name],i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+name;b.className=selected===i?'active':'';b.onclick=()=>{selected=i;renderBar()};return b}))}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key>='1'&&e.key<='9'){selected=+e.key-1;renderBar()}if(e.key.toLowerCase()==='e')eat(p);if(e.key.toLowerCase()==='r'&&p.dead)reset();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',e=>{if(e.target===c)mouse.down=true});addEventListener('mouseup',()=>mouse.down=false);
function move(a,dx,dy,dt){let m=Math.hypot(dx,dy)||1;a.x=clamp(a.x+dx/m*a.speed*dt,20,WORLD-20);a.y=clamp(a.y+dy/m*a.speed*dt,20,WORLD-20);for(let b of builds)if(b.type==='wall'&&dist(a,b)<36){let d=dist(a,b)||1;a.x+=((a.x-b.x)/d)*5;a.y+=((a.y-b.y)/d)*5}}
function botAI(b,dt){if(b.dead){b.respawn-=dt;if(b.respawn<=0){b.dead=false;b.hp=b.maxhp;b.x=rand(100,WORLD-100);b.y=rand(100,WORLD-100)}return}b.brain-=dt;let enemies=[p,...bots].filter(a=>a!==b&&!a.dead&&dist(a,b)<310);let enemy=enemies.sort((a,z)=>dist(a,b)-dist(z,b))[0];if(enemy){b.target=enemy;b.weapon=b.age>2?2:1}else if(!b.target||b.brain<=0||b.target.hp<=0){b.target=nodes.reduce((best,n)=>dist(n,b)<dist(best||{x:1e5,y:1e5},b)?n:best,null);b.brain=rand(2,5);b.weapon=1}let t=b.target;if(t){let d=dist(b,t);b.angle=Math.atan2(t.y-b.y,t.x-b.x);if(d>(enemy?66:54))move(b,Math.cos(b.angle),Math.sin(b.angle),dt);if(d<105)hit(b)}if(b.wood>=15&&Math.random()<dt*.12){b.angle+=rand(-2,2);build(b,Math.random()<.7?'wall':'spike')}if(b.hp<65)eat(b);if(b.xp>=b.age*110){b.xp=0;b.age++;b.maxhp+=10;b.hp+=10}}
function update(dt){if(paused)return;for(let a of [p,...bots]){a.attack=Math.max(0,a.attack-dt);a.buildCooldown=Math.max(0,a.buildCooldown-dt)}if(!p.dead){let dx=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft)),dy=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup));if(dx||dy)move(p,dx,dy,dt);p.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);if(mouse.down||keys[' '])action()}for(let b of bots)botAI(b,dt);for(let a of animals){a.think-=dt;if(a.think<=0){a.angle+=rand(-2,2);a.think=rand(.7,3)}let target=[p,...bots].find(v=>!v.dead&&dist(v,a)<120);if(target&&(a.type==='wolf'||a.type==='bull')){a.angle=Math.atan2(target.y-a.y,target.x-a.x);if(dist(a,target)<35&&Math.random()<dt*.7)hurt(target,a.type==='bull'?17:10,null)}a.x=clamp(a.x+Math.cos(a.angle)*a.speed*dt,30,WORLD-30);a.y=clamp(a.y+Math.sin(a.angle)*a.speed*dt,30,WORLD-30)}for(let b of builds){b.tick+=dt;if(b.type==='mill'&&b.tick>3){b.tick=0;let owner=[p,...bots].find(a=>a.id===b.owner);if(owner){owner.gold+=3;owner.score+=3}}if(b.type==='turret'&&b.tick>.9){let target=[p,...bots].find(a=>a.id!==b.owner&&!a.dead&&dist(a,b)<260);if(target){b.tick=0;shots.push({x:b.x,y:b.y,target,owner:b.owner,life:2})}}}for(let s of [...shots]){s.life-=dt;let t=s.target,d=dist(s,t);if(t.dead||s.life<=0){shots.splice(shots.indexOf(s),1);continue}let speed=480;if(d<speed*dt+15){hurt(t,17,[p,...bots].find(a=>a.id===s.owner));shots.splice(shots.indexOf(s),1)}else{s.x+=(t.x-s.x)/d*speed*dt;s.y+=(t.y-s.y)/d*speed*dt}}for(let q of [...particles]){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(particles.indexOf(q),1)}if(nodes.length<290&&Math.random()<dt*3){let type=['tree','rock','berry','gold'][Math.floor(Math.random()*4)];nodes.push({id:++uid,x:rand(40,WORLD-40),y:rand(40,WORLD-40),type,hp:kinds[type].hp})}}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);let camX=p.x-W/2,camY=p.y-H/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#9acb75';ctx.fillRect(0,0,WORLD,WORLD);ctx.fillStyle='#e3e8e8';ctx.fillRect(0,0,WORLD,450);ctx.fillStyle='#d8bd79';ctx.fillRect(0,WORLD-470,WORLD,470);ctx.fillStyle='#72b9da';ctx.fillRect(WORLD*.47,0,190,WORLD);ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;for(let x=0;x<WORLD;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke()}for(let y=0;y<WORLD;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}ctx.strokeStyle='#537f47';ctx.lineWidth=12;ctx.strokeRect(0,0,WORLD,WORLD);function visible(o){return Math.abs(o.x-p.x)<W/2+100&&Math.abs(o.y-p.y)<H/2+100}for(let n of nodes)if(visible(n)){let k=kinds[n.type];circle(n.x,n.y,k.radius+4,'#0002');circle(n.x,n.y,k.radius,k.color);if(n.type==='tree'){circle(n.x-9,n.y-6,12,'#4d9746');circle(n.x+10,n.y+7,14,'#448b3f')}if(n.type==='berry')for(let i=0;i<4;i++)circle(n.x+Math.cos(i*1.57)*10,n.y+Math.sin(i*1.57)*10,4,'#f47b92')}for(let a of animals)if(visible(a)){circle(a.x,a.y,19,a.type==='wolf'?'#777':a.type==='bull'?'#624333':a.type==='pig'?'#e8a3a3':'#f0e8d9');circle(a.x-6,a.y-4,3,'#222');circle(a.x+6,a.y-4,3,'#222');if(a.type==='bull'){circle(a.x-18,a.y-13,7,'#ded8bd');circle(a.x+18,a.y-13,7,'#ded8bd')}}for(let b of builds)if(visible(b)){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle={wall:'#b8a17b',spike:'#666',mill:'#e9e3c9',turret:'#555'}[b.type];if(b.type==='wall')ctx.fillRect(-24,-24,48,48);else if(b.type==='spike'){ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*29,Math.sin(a)*29)}ctx.fill()}else{circle(0,0,20,ctx.fillStyle);if(b.type==='mill'){ctx.rotate(performance.now()/700);ctx.fillStyle='#fff';ctx.fillRect(-5,-29,10,58);ctx.fillRect(-29,-5,58,10)}}ctx.restore()}for(let a of [...bots,p])if(!a.dead&&visible(a)){circle(a.x,a.y+5,25,'#0003');circle(a.x,a.y,24,a===p?'#f5e2b3':'#e5b68f');ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);ctx.fillStyle=a.weapon===2?'#ddd':'#8b6747';ctx.fillRect(16,-7,a.weapon===3?58:37,14);ctx.restore();ctx.fillStyle='#222';circle(a.x-7,a.y-5,3,'#222');circle(a.x+7,a.y-5,3,'#222');ctx.fillStyle='#333';ctx.fillRect(a.x-29,a.y-42,58,7);ctx.fillStyle='#59d66e';ctx.fillRect(a.x-29,a.y-42,58*Math.max(0,a.hp/a.maxhp),7);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 12px Arial';ctx.fillText(a.name+' ['+a.age+']',a.x,a.y-49)}for(let s of shots)circle(s.x,s.y,5,'#333');for(let q of particles)circle(q.x,q.y,3,q.color);ctx.restore();ctx.save();ctx.globalAlpha=.88;ctx.fillStyle='#152b25';ctx.fillRect(W-166,H-178,150,150);ctx.fillStyle='#b6d48a';ctx.fillRect(W-159,H-171,136,136);ctx.fillStyle='#75bce0';ctx.fillRect(W-159+136*.47,H-171,8,136);for(let b of bots){ctx.fillStyle='#e95d54';ctx.fillRect(W-159+b.x/WORLD*136,H-171+b.y/WORLD*136,3,3)}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W-159+p.x/WORLD*136,H-171+p.y/WORLD*136,4,0,7);ctx.fill();ctx.restore();document.querySelector('#stats').textContent='🪵 '+Math.floor(p.wood)+'  🪨 '+Math.floor(p.stone)+'  🟡 '+Math.floor(p.gold)+'  🍎 '+Math.floor(p.food);document.querySelector('#health').textContent='HP '+Math.ceil(Math.max(0,p.hp))+'/'+p.maxhp+' · Kills '+p.kills;document.querySelector('#age').textContent='Age '+p.age+' · XP '+Math.floor(p.xp)+'/'+p.age*110+' · Score '+Math.floor(p.score);document.querySelector('#leaders').innerHTML=[p,...bots].sort((a,b)=>b.score-a.score).slice(0,8).map((a,i)=>'<div>'+(i+1)+'. '+a.name+' — '+Math.floor(a.score)+'</div>').join('')}
function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
